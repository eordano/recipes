set  -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:hyperlinks"        # OSC 8: clickable links (rg, ls, grep)
set -as terminal-features ",*:usstyle"           # colored undercurl for LSP diagnostics
set -as terminal-features ",*:sync"              # synchronized output, no tearing
set -as terminal-features ",*:osc7"              # CWD reports — new tabs open in $PWD
set -as terminal-features ",*:overline"
set -as terminal-features ",*:strikethrough"
set -as terminal-features ",*:notifications"     # OSC 9 / OSC 777 desktop notifications

# Let DCS-wrapped escapes (OSC 9 notifications, etc.) reach the outer terminal.
set -g allow-passthrough on

# Forward terminal focus in/out events to applications (nvim autoread, etc.)
set -g focus-events on

set  -g base-index      1
setw -g pane-base-index 1

set -g status-keys vi
set -g mode-keys   vi
set -g set-clipboard on

set-option -g prefix C-a
set-option -g prefix2 C-b
unbind-key C-a
bind-key C-a send-prefix
unbind-key C-b
bind-key C-b send-prefix

setw -g mouse on

set -g renumber-windows on

setw -g monitor-activity off
set -g visual-activity off

set -sg escape-time 0

setw -g pane-base-index 1

# split window and keep the current path
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind | split-window -h
bind - split-window -v

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

bind -r H resize-pane -L 6
bind -r J resize-pane -D 6
bind -r K resize-pane -U 6
bind -r L resize-pane -R 6

bind-key x kill-pane

bind-key S-Left swap-window -t -1\; select-window -t -1
bind-key S-Right swap-window -t +1\; select-window -t +1

bind-key + swap-pane -t '~' \; select-pane -M

bind ^r refresh-client

bind Enter copy-mode
bind b list-buffers
bind B choose-buffer
bind p paste-buffer
bind P run "xclip -selection clipboard -o | tmux load-buffer - ; tmux paste-buffer"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi C-g send-keys -X cancel
bind -T copy-mode-vi H send-keys -X start-of-line
bind -T copy-mode-vi L send-keys -X end-of-line

set-option -s escape-time 0

# 24-hour clock (Nord theme reads this)
set -g clock-mode-style 24
