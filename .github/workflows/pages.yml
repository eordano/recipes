name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "behaviors/**"
      - "overlays/**"
      - "packages/**"
      - "lib/**"
      - "tools/**"
      - "mkdocs.yml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.x"
      - name: Install MkDocs Material
        run: pip install --require-hashes -r tools/requirements.txt
      - name: Check for private-data leaks
        env:
          LEAK_GUARD_PATTERN: ${{ secrets.LEAK_GUARD_PATTERN }}
        run: ./leak-guard.sh
      - name: Test site generator
        working-directory: tools
        run: python3 -m unittest test_gen_site.py
      - name: Generate site source from recipe READMEs
        run: python3 tools/gen_site.py
      - name: Build (strict -- fails on broken links / warnings)
        run: mkdocs build --strict
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
